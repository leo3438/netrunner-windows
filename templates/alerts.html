<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Historique des Alertes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        table {
            width: 80%;
            margin: 20px auto;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        }
        th, td {
            padding: 12px;
            border: 1px solid #ddd;
            text-align: left;
        }
        th {
            background: #007bff;
            color: white;
        }
        tr:nth-child(even) {
            background: #f9f9f9;
        }
        .delete-btn {
            background: red;
            color: white;
            border: none;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 5px;
        }
        .delete-btn:hover {
            background: darkred;
        }
    </style>
</head>
<body>

    <h1>📜 Historique des Alertes</h1>
    <a href="/"><button>⬅ Retour</button></a>
    
    <table>
        <thead>
            <tr>
                <th>Horodatage</th>
                <th>Message</th>
            </tr>
        </thead>
        <tbody>
            {% for log in logs %}
                <tr>
                    <td>{{ log.split(']')[0][1:] }}</td>  <!-- Extraction de la date -->
                    <td>{{ log.split(']')[1] }}</td>  <!-- Extraction du message -->
                </tr>
            {% endfor %}
        </tbody>
    </table>

    <br>
    <form action="/clear_alerts" method="POST">
        <button class="delete-btn">🗑 Effacer l'historique</button>
    </form>

</body>
</html>
