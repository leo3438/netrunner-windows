<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Détails du Harvester</title>
    <style>
        /* Styles généraux */
body {
  font-family: 'Arial', sans-serif;
  margin: 20px;
  background: #f4f4f4;
  color: #333;
  text-align: center;
}

/* Tableaux */
table {
  border-collapse: collapse;
  width: 90%;
  margin: 20px auto;
  background: white;
  border-radius: 10px;
  box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
}

th, td {
  padding: 12px 15px;
  border: 1px solid #ddd;
  text-align: left;
}

th {
  background: #007bff;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}

th:hover {
  background: #0056b3;
}

/* Lignes alternées */
tr:nth-child(even) {
  background: #f9f9f9;
}

/* État des Harvesters */
.connected { color: green; font-weight: bold; }
.disconnected { color: red; font-weight: bold; }

/* Boutons */
button {
  background: #007bff;
  color: white;
  padding: 10px 15px;
  border: none;
  cursor: pointer;
  border-radius: 5px;
  transition: 0.3s;
}

button:hover {
  background: #0056b3;
}

/* Mode sombre */
body.dark-mode {
  background-color: #121212;
  color: white;
}

body.dark-mode table {
  background: #1e1e1e;
  color: white;
}

body.dark-mode th {
  background: #333;
}

body.dark-mode td {
  background: #222;
  color: white;
}

/* Effet sur les liens */
a {
  color: #007bff;
  text-decoration: none;
}

a:hover {
  text-decoration: underline;
}

    </style>
</head>
<body>

    <!-- Bouton pour le mode sombre -->
    <button id="dark-mode-toggle">🌙 Mode sombre</button>

    <h1>Détails de {{ harvester.name }}</h1>
    <table>
        <tr><th>ID</th><td>{{ harvester.id }}</td></tr>
        <tr><th>Nom</th><td>{{ harvester.name }}</td></tr>
        <tr><th>IP</th><td>{{ harvester.ip }}</td></tr>
        <tr><th>État</th><td class="{{ harvester.state }}">{{ harvester.state }}</td></tr>
        <tr><th>Version</th><td>{{ harvester.version }}</td></tr>
        <tr><th>Machines détectées</th><td>{{ harvester.num_machines }}</td></tr>
        <tr><th>Latence WAN</th><td>{{ harvester.latence_wan }}</td></tr>
    </table>

    <p><a href="/">⬅ Retour à la liste</a></p>

    <script>
        // Gestion du mode sombre
        const toggleButton = document.getElementById('dark-mode-toggle');
      
        // Vérifier si le mode sombre était activé
        if (localStorage.getItem('dark-mode') === 'enabled') {
            document.body.classList.add('dark-mode');
            toggleButton.textContent = '☀️ Mode clair';
        }

        // Toggle du mode sombre
        toggleButton.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('dark-mode', 'enabled');
                toggleButton.textContent = '☀️ Mode clair';
            } else {
                localStorage.setItem('dark-mode', 'disabled');
                toggleButton.textContent = '🌙 Mode sombre';
            }
        });
    </script>

</body>
</html>
