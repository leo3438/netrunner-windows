<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>📊 Statistiques des Harvesters et Alertes</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 20px;
        }
        canvas {
            max-width: 600px;
            margin: 20px auto;
        }
        /* Mode sombre */
        body.dark-mode {
            background-color: #121212;
            color: white;
        }
        .container {
            width: 80%;
            margin: auto;
        }
        .card {
            background: white;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            margin: 20px auto;
            width: 80%;
        }
        body.dark-mode .card {
            background: #1e1e1e;
            color: white;
        }
        button {
            background: #007bff;
            color: white;
            padding: 10px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h1>📊 Statistiques</h1>
    <a href="/"><button>⬅ Retour</button></a>

    <div class="container">
        <div class="card">
            <h2>🖥 Harvesters</h2>
            <canvas id="machinesChart"></canvas>
            <canvas id="latenceChart"></canvas>
        </div>

        <div class="card">
            <h2>🚨 Statistiques des Alertes</h2>
            <canvas id="alertsChart"></canvas>
        </div>
    </div>

    <script>
        // Charger les statistiques des harvesters
        fetch('/api/stats')
            .then(response => response.json())
            .then(data => {
                new Chart(document.getElementById('machinesChart').getContext('2d'), {
                    type: 'bar',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Nombre de Machines',
                            data: data.num_machines,
                            backgroundColor: 'blue',
                            borderColor: 'black',
                            borderWidth: 1
                        }]
                    }
                });

                new Chart(document.getElementById('latenceChart').getContext('2d'), {
                    type: 'line',
                    data: {
                        labels: data.labels,
                        datasets: [{
                            label: 'Latence WAN (ms)',
                            data: data.latence,
                            backgroundColor: 'red',
                            borderColor: 'black',
                            borderWidth: 1
                        }]
                    }
                });
            })
            .catch(err => console.error('❌ Erreur de récupération des stats:', err));

        // Charger les statistiques des alertes
        fetch('/api/alert_stats')
            .then(response => response.json())
            .then(alertData => {
                new Chart(document.getElementById('alertsChart').getContext('2d'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(alertData),
                        datasets: [{
                            label: 'Nombre d\'alertes',
                            data: Object.values(alertData),
                            backgroundColor: ['red', 'orange'],
                            borderWidth: 1
                        }]
                    }
                });
            })
            .catch(err => console.error('❌ Erreur de récupération des alertes:', err));
    </script>

</body>
</html>
